name: Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Install the Android toolchain
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/nihongo-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --silent --show-error --location --retry 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            --output "$archive"
          printf '%s  %s\n' 0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8 "$archive" | sha256sum --check
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$archive" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Generate the Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build the bundled test app
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Verify the signed Android bundle and record build details
        working-directory: android/app/build/outputs/apk/release
        run: |
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify app-release.apk
          unzip -tqq app-release.apk assets/index.android.bundle 'lib/arm64-v8a/*.so'
          sha256sum app-release.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nArchitecture: arm64-v8a\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: NihongoLearn-test-arm64
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            android/app/build/outputs/apk/release/BUILD.txt
          if-no-files-found: error
          retention-days: 7
